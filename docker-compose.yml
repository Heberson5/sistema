version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: funeraria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: funeraria
      POSTGRES_PASSWORD: funeraria
      POSTGRES_DB: funeraria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
